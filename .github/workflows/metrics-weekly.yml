# Reusable: weekly productivity scoreboard, posted as an issue.
name: metrics-weekly (reusable)

on:
  workflow_call:
    inputs:
      days:
        required: false
        type: string
        default: "7"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/psumiya/neo.git /tmp/harness
          python3 /tmp/harness/scripts/metrics.py --days ${{ inputs.days }} > /tmp/report.md
          cat /tmp/report.md
      # One rolling report: close the previous week's before leaving the new one open.
      - name: Post report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          PRIOR=$(gh issue list --repo "$REPO" --state open --label harness-report \
            --search 'in:title "Harness weekly report"' --limit 50 --json number,title \
            --jq '.[] | select(.title | startswith("Harness weekly report")) | .number')
          NEW=$(gh issue create --repo "$REPO" \
            --title "Harness weekly report ($(date -u +%Y-%m-%d))" \
            --label "harness-report" \
            --body-file /tmp/report.md)
          echo "$NEW"
          for n in $PRIOR; do
            gh issue close "$n" --repo "$REPO" --reason "not planned" \
              --comment "Superseded by $NEW"
          done
